[General]
Count=1

; Яркости — в единицах кадра при экспозиции 0 EV: средний серый (0,18) после освещения ≈ правильно
; экспонированная поверхность. Первый направленный источник — солнце: по нему считается небо
;
; Источник [LightN]: Type = Dir / Point / Spot, Color — цвет × яркость. Direction (Dir, Spot) — куда идёт свет.
; Position (Point, Spot) — положение, м; AttenuationRadius — на нём свет плавно спадает до нуля, м (0 — только
; обратный квадрат). InnerConeAngle / OuterConeAngle (Spot) — углы от оси до края, градусы: внутри внутреннего
; полная яркость, за внешним света нет (по умолчанию 0 и 45)

; Процедурное небо и освещение окружением от него (SkyAtmosphere). SkyIntensity — множитель рассеянного света
; (1 — по модели), Haze — плотность дымки, GroundAlbedo — отражение земли
; под горизонтом. Меняются и в GUI, окно «Sky atmosphere»
[Sky]
SkyIntensity=1
Haze=1
GroundAlbedo=0.25

[Light0]
Type=Dir
Color=3.0,3.0,2.64
Direction=-1.0,-1.0,1.0

; Постобработка: поправка экспозиции в EV (+1 — вдвое ярче) и тонмаппинг None / ACES (как Filmic в UE) /
; AgX (как в Blender 4+). Меняются и в GUI, окно «Post process»
[PostProcess]
ExposureCompensation=0
Tonemapper=AgX

; Каскадные тени солнца (ShadowCascades, имена как у directional light в UE). Resolution — размер карты каскада,
; текселей (при запуске); DynamicShadowDistance — до скольких метров от камеры есть тени; CascadeDistributionExponent —
; во сколько раз каждый каскад длиннее предыдущего; CascadeTransitionFraction — доля каскада, где он смешивается
; со следующим; ShadowDistanceFadeoutFraction — доля дистанции, на которой тень плавно уходит. Против самозатенения:
; ShadowBias и NormalBias — сдвиг точки к солнцу и по нормали, в текселях каскада, ShadowSlopeBias — наклонное
; смещение глубины в растеризаторе. Меняются и в GUI, окно «Shadows»
[Shadows]
Enabled=true
Resolution=2048
DynamicShadowDistance=200
CascadeDistributionExponent=3
CascadeTransitionFraction=0.1
ShadowDistanceFadeoutFraction=0.1
ShadowBias=1
NormalBias=1
ShadowSlopeBias=2


[LightSave]
Position=0.05,1.0,0.05

[Light1]
Type=Dir
Color=1.0,1.0,1.0
Direction=-1.0,-1.0,1.0

[Light2]
Type=Point
Color=1.0,1.0,1.0
Position=110.0,90.0,100.0
AttenuationRadius=10.0
