[General]
; Окно и задний буфер: desktop — окно без рамки на весь основной монитор в его разрешении; 1920x1080 — окно
; с заголовком и такой клиентской областью. Параметр запуска -resolution перекрывает (Tools: по умолчанию 1920x1080)
Resolution=desktop
VSync=false
ScreenDepth=4000.0
ScreenNear=0.1
; Размер среза каскадной карты теней солнца, текселей
ShadowMapResolution=2048
; Depth prepass: глубина непрозрачных до прохода цвета (как r.EarlyZPass в UE); false — выключен
DepthPrepass=true
; GPU-based validation debug-слоя D3D12 в Debug-сборке (медленно); false — только debug-слой
GpuValidation=true

[Camera]
Position=512.0,90.0,150.0
Rotation=20.0,0.0

[Level]
Name=Test
